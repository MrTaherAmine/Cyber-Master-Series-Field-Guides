name: Unpack Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Cyber Master Series Field Guides
        run: |
          mkdir -p /tmp/cmsfg
          unzip -q Cyber-Master-Series-Field-Guides.zip -d /tmp/cmsfg

          cp -a /tmp/cmsfg/Cyber-Master-Series-Field-Guides/. .

          rm Cyber-Master-Series-Field-Guides.zip

      - name: Commit repository structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Initialize Cyber Master Series Field Guides" || exit 0

          git push
